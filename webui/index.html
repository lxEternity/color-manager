<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color管理器 · WebUI</title>
<style>
:root{
  --bg:#F5F7FC; --card:#FFFFFF; --stroke:#E4EBF4;
  --t1:#1B2540; --t2:#5D6B85; --t3:#9AA7BD;
  --ac:#0096C8; --ac2:#A02CF0; --orange:#E08A00;
  --mc0:#00B5A3; --mc2:#E08A00; --soft:#E5F7FD;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);font:14px/1.45 -apple-system,"HarmonyOS Sans SC","MiSans",Roboto,sans-serif;padding-bottom:64px}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}

/* 顶栏 */
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
header svg{width:38px;height:38px}
header h1{font-size:17px;font-weight:700}
header small{display:block;color:var(--t3);font-size:11px;font-weight:400}
.demo-badge{margin-left:auto;background:#FFF3E0;color:var(--orange);border:1px solid #FFD9A0;
  font-size:11px;padding:3px 9px;border-radius:20px;display:none}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:14px;margin-bottom:11px;
  box-shadow:0 1px 3px rgba(27,37,64,.04)}

/* SOC 环 + 功耗 */
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:24px}
.ring .val i{font-style:normal;color:var(--t3);font-size:10px}
.hero-right{flex:1;min-width:0}
.hero-right .lbl{color:var(--t3);font-size:12px}
.hero-right .pw{font-size:32px;font-weight:800;color:var(--ac);line-height:1.1}
.hero-right .pw small{font-size:14px;font-weight:600}
.st-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:20px;margin-top:6px}
.st-badge.chg{background:#E0F7F3;color:var(--mc0)}
.st-badge.dis{background:#FFF3E0;color:var(--orange)}

/* 数据网格 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--soft);border-radius:12px;padding:9px 6px;text-align:center}
.cell i{font-style:normal;display:block;color:var(--t3);font-size:10px}
.cell b{font-size:14px}
.cell b em{font-style:normal;font-size:10px;color:var(--t2);font-weight:400}

/* 电芯选择 */
.cell-pick .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cell-pick .h i{font-style:normal;color:var(--t3);font-size:12px}
.cell-pick .h i b{color:var(--ac)}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--t2);font-size:12px;font-weight:600;
  padding:7px 0;border-radius:9px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--card);color:var(--ac);box-shadow:0 1px 4px rgba(0,150,200,.25)}

/* 曲线 */
canvas{width:100%;height:76px;display:block}

/* 入口 */
.entry{display:flex;align-items:center;gap:11px;cursor:pointer}
.entry .bar{width:4px;height:30px;border-radius:3px}
.entry .tx{flex:1}
.entry .tx b{font-size:14px}
.entry .tx i{font-style:normal;display:block;color:var(--t3);font-size:11px;margin-top:1px}
.entry svg{width:16px;height:16px;flex:none}

/* 页面切换 */
.page{display:none}
.page.on{display:block}

/* 模式 chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.chip{border:1.5px solid var(--stroke);background:var(--card);color:var(--t2);font-size:12px;font-weight:600;
  padding:6px 13px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.on{background:var(--card);box-shadow:0 2px 8px rgba(27,37,64,.08)}
.desc{color:var(--t3);font-size:12px;margin:-2px 2px 11px}

/* 滑条 */
.sl{display:flex;align-items:center;gap:10px;padding:7px 0}
.sl label{width:88px;flex:none;font-size:12px;color:var(--t2)}
.sl output{width:58px;flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--ac) var(--p,50%),#E0E8F2 var(--p,50%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:#fff;border:2.5px solid var(--ac);box-shadow:0 1px 5px rgba(0,150,200,.4)}

/* 保存按钮 */
.btn{width:100%;border:0;background:linear-gradient(90deg,#00C3F0,#A02CF0);color:#fff;font-size:14px;font-weight:700;
  padding:11px 0;border-radius:20px;cursor:pointer;margin-top:13px;
  box-shadow:0 4px 16px rgba(0,180,224,.35);transition:.15s}
.btn:active{transform:scale(.97);opacity:.9}

/* 调速器 */
.gov-head{display:flex;align-items:center;justify-content:space-between}
.gov-head .cur small{display:block;color:var(--t3);font-size:11px}
.gov-head .cur b{font-size:19px;color:var(--ac)}
/* 自定义下拉 */
.dd{position:relative}
.dd-btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--card);
  border:1.5px solid var(--ac);color:var(--ac);font-size:13px;font-weight:700;
  padding:9px 18px;border-radius:20px;cursor:pointer}
.dd-btn svg{width:13px;height:13px;transition:.2s}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-list{position:absolute;top:calc(100% + 6px);right:0;min-width:170px;z-index:30;
  background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(0,184,224,.25);border-radius:14px;padding:5px;display:none;
  box-shadow:0 10px 30px rgba(27,37,64,.16)}
.dd.open .dd-list{display:block}
.dd-list .it{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
  font-size:13px;color:var(--t1);border-radius:10px;cursor:pointer}
.dd-list .it:hover{background:var(--soft)}
.dd-list .it.on{color:var(--ac);font-weight:700;background:var(--soft)}
.dd-list .it.on::after{content:"✓";font-size:12px}
.gv-note{color:var(--t3);font-size:12px;margin:12px 2px 0}
.applied-note{display:none;color:var(--orange);font-size:11px;text-align:center;margin-top:7px}

/* toast */
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);color:var(--ac);font-size:13px;font-weight:700;
  border:1px solid rgba(0,184,224,.3);padding:9px 22px;border-radius:22px;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,150,200,.22);transition:.25s;z-index:99}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* 底部导航 */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-top:1px solid var(--stroke);z-index:50}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;
  align-items:center;gap:2px;color:var(--t3);font-size:11px;cursor:pointer}
nav button svg{width:21px;height:21px}
nav button.on{color:var(--ac);font-weight:700}

/* 参数分组标题 */
.group{color:var(--t3);font-size:11px;margin:9px 0 1px;padding-left:2px}
</style>
</head>
<body>
<div class="wrap">

<!-- 顶栏 -->
<header>
  <svg viewBox="0 0 108 108">
    <rect x="25" y="25" width="58" height="58" rx="12" fill="rgba(0,229,255,.04)" stroke="#00B8E0" stroke-width="3"/>
    <path d="M41 34v4M54 34v4M67 34v4M41 70v4M54 70v4M67 70v4M34 41h4M34 54h4M34 67h4M70 41h4M70 54h4M70 67h4" stroke="#93A7C4" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="38" y="38" width="32" height="32" rx="5" fill="#2A63E8"/>
    <rect x="41" y="41" width="16" height="4" rx="2" fill="#fff" opacity=".3"/>
    <path d="M42 57h6l3.5-8 4.5 14 4-11 3 5h8" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 45l4 7h-8z" fill="#FFC400"/>
    <circle cx="65" cy="46" r="5" fill="none" stroke="#FF9100" stroke-width="1.6"/>
    <path d="M65 42.5c1.4 1.8 2.7 2.6 2.7 4.2a2.7 2.7 0 1 1-5.4 0c0-1.6 1.3-2.4 2.7-4.2z" fill="#FF9100"/>
  </svg>
  <div><h1>Color管理器<small>调度 · 调速 · 电芯</small></h1></div>
  <span class="demo-badge" id="demoBadge">演示模式</span>
</header>

<!-- ===== 主页 ===== -->
<section class="page on" id="pg-home">
  <div class="card hero">
    <div class="ring">
      <svg width="104" height="104">
        <circle cx="52" cy="52" r="46" fill="none" stroke="#E8F1F8" stroke-width="8"/>
        <circle id="ringArc" cx="52" cy="52" r="46" fill="none" stroke="#0096C8" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289"/>
      </svg>
      <div class="val"><b id="socV">--</b><i>电量 SOC</i></div>
    </div>
    <div class="hero-right">
      <div class="lbl">实时功耗</div>
      <div class="pw" id="pwV">--<small> W</small></div>
      <span class="st-badge dis" id="stBadge">⬇ 放电中</span>
    </div>
  </div>

  <div class="card grid">
    <div class="cell"><i>电压</i><b id="vV">--</b></div>
    <div class="cell"><i>电流</i><b id="aV">--</b></div>
    <div class="cell"><i>温度</i><b id="tV">--</b></div>
    <div class="cell"><i>循环</i><b id="cV">--</b></div>
  </div>

  <div class="card cell-pick">
    <div class="h"><span style="font-weight:700">电芯检测</span>
      <i>识别: <b id="cellDet">--</b> · <span id="cpuN">--</span> 核</i></div>
    <div class="seg" id="cellSeg">
      <button data-v="0" class="on">自动识别</button>
      <button data-v="1">单电芯</button>
      <button data-v="2">双电芯</button>
    </div>
  </div>

  <div class="card"><canvas id="spark"></canvas>
    <div class="group" style="text-align:center">功耗曲线 · W</div></div>

  <div class="card entry" onclick="go('modes')">
    <div class="bar" style="background:var(--ac)"></div>
    <div class="tx"><b>调度参数</b><i>四模式 CPU 频率与提升参数</i></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="#0096C8" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <div class="card entry" onclick="go('gov')">
    <div class="bar" style="background:var(--ac2)"></div>
    <div class="tx"><b>调速器配置</b><i>预设调速器切换与参数</i></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="#A02CF0" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
  </div>
</section>

<!-- ===== 调度参数 ===== -->
<section class="page" id="pg-modes">
  <div class="chips" id="modeChips"></div>
  <div class="desc" id="modeDesc"></div>
  <div class="card" id="modeSliders"></div>
  <button class="btn" onclick="saveMode()">保存</button>
</section>

<!-- ===== 调速器配置 ===== -->
<section class="page" id="pg-gov">
  <div class="card gov-head">
    <div class="cur"><small>当前调速器</small><b id="govNow">--</b></div>
    <div class="dd" id="dd">
      <button class="dd-btn" onclick="ddToggle(event)">
        <span id="ddLabel">切换调速器</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="dd-list" id="ddList"></div>
    </div>
  </div>
  <div class="card" id="govSliders"></div>
  <button class="btn" onclick="saveGov()">保存</button>
  <div class="applied-note" id="appliedNote">⚠ 未能写入 sysfs（需要 root），参数已保存</div>
</section>

</div>
<div id="toast">已保存，实时生效</div>

<nav><div class="in">
  <button id="nb-home" class="on" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>主页</button>
  <button id="nb-modes" onclick="go('modes')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M4 12h16M4 18h13"/></svg>调度参数</button>
  <button id="nb-gov" onclick="go('gov')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>调速器</button>
</div></nav>

<script>
/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const MODE_COLORS = ['#00B5A3','#0096C8','#E08A00','#A02CF0'];
const MODE_DESC = ['powersave · 最长续航，压制频率与提升值','balance · 日常使用，兼顾流畅与功耗',
  'performance · 高负载场景，激进提升','fast · 极限性能，全力释放'];
let toastT;
function toast(t){ $('toast').textContent=t||'已保存，实时生效'; $('toast').classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>$('toast').classList.remove('show'),1600); }

/* ---------- 页面切换 ---------- */
function go(p){
  ['home','modes','gov'].forEach(k=>{
    $('pg-'+k).classList.toggle('on',k===p);
    $('nb-'+k).classList.toggle('on',k===p);
  });
  if(p==='modes') loadModes();
  if(p==='gov') loadGov();
  if(p==='home') refresh();
}

/* ---------- 主页 ---------- */
let hist=[], cellMode=0, demoMode=false;
async function refresh(){
  try{
    const s = await (await fetch('/api/status')).json();
    demoMode = s.demo;
    $('demoBadge').style.display = s.demo?'inline-block':'none';
    $('socV').textContent = s.soc+'%';
    const C = 2*Math.PI*46;
    $('ringArc').setAttribute('stroke-dashoffset', C*(1-(s.soc||0)/100));
    $('pwV').innerHTML = (s.power??'--')+'<small> W</small>';
    const b=$('stBadge');
    if(s.charging){ b.className='st-badge chg'; b.textContent='⚡ 充电中'; }
    else{ b.className='st-badge dis'; b.textContent='⬇ 放电中'; }
    $('vV').textContent = s.voltage+' V';
    $('aV').textContent = (s.current<0?'-':'')+(Math.abs(s.current)/1000).toFixed(2)+' A';
    $('tV').textContent = s.temp+' ℃';
    $('cV').textContent = s.cycle??'--';
    $('cellDet').textContent = s.cells===2?'双电芯':'单电芯';
    $('cpuN').textContent = s.cpuCount;
    cellMode = s.cellMode;
    document.querySelectorAll('#cellSeg button').forEach(btn=>btn.classList.toggle('on',+btn.dataset.v===cellMode));
    if(s.power!=null){ hist.push(s.power); if(hist.length>70)hist.shift(); draw(); }
  }catch(e){}
}
document.querySelectorAll('#cellSeg button').forEach(btn=>btn.onclick = async ()=>{
  document.querySelectorAll('#cellSeg button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  await fetch('/api/cells',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cellMode:+btn.dataset.v})});
  toast('电芯已切换'); refresh();
});

function draw(){
  const cv=$('spark'), dpr=devicePixelRatio||1;
  const w=cv.clientWidth, h=76;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(!hist.length) return;
  const max=Math.max(...hist)*1.15||1, min=Math.min(...hist)*0.85;
  const X=i=>i/(hist.length-1||1)*w, Y=v=>h-6-(v-min)/(max-min||1)*(h-12);
  const g=ctx.createLinearGradient(0,0,w,0); g.addColorStop(0,'#00E5FF'); g.addColorStop(1,'#A02CF0');
  ctx.beginPath(); hist.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(0),Y(v)));
  ctx.strokeStyle=g; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.stroke();
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  const f=ctx.createLinearGradient(0,0,0,h);
  f.addColorStop(0,'rgba(0,180,224,.28)'); f.addColorStop(1,'rgba(160,44,240,0)');
  ctx.fillStyle=f; ctx.fill();
}

/* ---------- 调度参数 ---------- */
const SLIDER_DEFS = [
  {k:'opt2',        t:'性能提升',  min:0,  max:100, step:1,  suf:'%'},
  {k:'cpuMax',      t:'CPU 上限',  min:5,  max:100, step:1,  suf:'%'},
  {k:'cpuMin',      t:'CPU 下限',  min:0,  max:95,  step:1,  suf:'%'},
  {k:'llcc',       t:'LLCC 频率', min:350000, max:1800000, step:50000, div:1000, suf:' MHz'},
  {k:'uclampDisplay', t:'显示增强', min:0, max:100, step:1, suf:'%'},
  {k:'uclampSsfg',    t:'后台增强', min:0, max:100, step:1, suf:'%'},
  {k:'uclampTouch',   t:'触控增强', min:0, max:100, step:1, suf:'%'},
  {k:'uclampMm',      t:'多媒体增强',min:0,max:100, step:1, suf:'%'},
  {k:'uclampRt',      t:'实时增强', min:0, max:100, step:1, suf:'%'},
  {k:'uclampTopApp',  t:'前台增强', min:0, max:100, step:1, suf:'%'},
  {k:'walt1', t:'WALT 限制1', min:0, max:100,   step:1,    suf:'', only:'fast'},
  {k:'walt2', t:'WALT 限制2', min:100,max:10000, step:100,  suf:' µs', only:'fast'},
];
let modesData={}, curMode='powersave';
async function loadModes(){
  const m = await (await fetch('/api/modes')).json();
  modesData = m.modes;
  const chips=$('modeChips'); chips.innerHTML='';
  m.order.forEach((k,i)=>{
    const c=document.createElement('button');
    c.className='chip'+(k===curMode?' on':'');
    c.innerHTML=`<span class="dot" style="background:${MODE_COLORS[i]}"></span>${m.names[k]}`;
    c.style.borderColor = k===curMode?MODE_COLORS[i]:'';
    c.onclick=()=>{curMode=k;renderMode();};
    chips.appendChild(c);
  });
  renderMode();
}
function renderMode(){
  document.querySelectorAll('#modeChips .chip').forEach((c,i)=>{
    const keys=['powersave','balance','performance','fast'];
    c.classList.toggle('on',keys[i]===curMode);
    c.style.borderColor = keys[i]===curMode?MODE_COLORS[i]:'';
  });
  const idx=['powersave','balance','performance','fast'].indexOf(curMode);
  $('modeDesc').textContent = MODE_DESC[idx];
  const md = modesData[curMode], box=$('modeSliders'); box.innerHTML='';
  SLIDER_DEFS.forEach(d=>{
    if(d.only && d.only!==curMode) return;
    const row=document.createElement('div'); row.className='sl';
    row.innerHTML=`<label>${d.t}</label>
      <input type="range" min="${d.min}" max="${d.max}" step="${d.step}"
        value="${md[d.k]}" data-k="${d.k}" data-div="${d.div||1}">
      <output></output>`;
    const inp=row.querySelector('input'), out=row.querySelector('output');
    const upd=()=>{ const v=+inp.value; md[d.k]=v;
      out.textContent=(d.div?v/d.div:v)+d.suf;
      const p=(v-d.min)/(d.max-d.min)*100; inp.style.setProperty('--p',p+'%'); };
    inp.oninput=upd; upd(); box.appendChild(row);
  });
}
async function saveMode(){
  await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key:curMode,mode:modesData[curMode]})});
  toast();
}

/* ---------- 调速器 ---------- */
const PRESETS=['conservative','walt','ips','sugov_next','scx','hmbird','powersave','performance','schedutil'];
let govCfg={}, govCur='';
async function loadGov(){
  const g = await (await fetch('/api/governors')).json();
  govCfg=g.config; govCur=g.current;
  $('govNow').textContent = govCur;
  if(!PRESETS.includes(govCfg.governor)) govCfg.governor=govCur;
  renderDd(); renderGovSliders();
}
function ddToggle(e){ e.stopPropagation(); $('dd').classList.toggle('open'); }
document.addEventListener('click',()=>$('dd')&&$('dd').classList.remove('open'));
function renderDd(){
  $('ddLabel').textContent = govCfg.governor;
  const L=$('ddList'); L.innerHTML='';
  PRESETS.forEach(p=>{
    const it=document.createElement('div');
    it.className='it'+(p===govCfg.governor?' on':'');
    it.textContent=p;
    it.onclick=()=>{ govCfg.governor=p; $('dd').classList.remove('open');
      renderDd(); renderGovSliders(); };
    L.appendChild(it);
  });
}
const GOV_SLIDERS={
  conservative:[
    {k:'upThreshold',t:'升频阈值',min:1,max:100,step:1,suf:'%'},
    {k:'downThreshold',t:'降频阈值',min:1,max:100,step:1,suf:'%'},
    {k:'freqStep',t:'调频步进',min:1,max:100,step:1,suf:'%'},
    {k:'samplingRate',t:'采样周期',min:1000,max:200000,step:1000,div:1000,suf:' ms'},
  ],
  scx:[{k:'targetLoads',t:'目标负载',min:1,max:100,step:1,suf:'%'}],
};
function renderGovSliders(){
  const box=$('govSliders'); box.innerHTML='';
  const defs=GOV_SLIDERS[govCfg.governor];
  if(!defs){ box.innerHTML=`<div class="gv-note" style="margin:4px 2px">该调速器无附加参数，保存即切换生效</div>`; return; }
  defs.forEach(d=>{
    const row=document.createElement('div'); row.className='sl';
    row.innerHTML=`<label>${d.t}</label>
      <input type="range" min="${d.min}" max="${d.max}" step="${d.step}"
        value="${govCfg[d.k]}" data-k="${d.k}" data-div="${d.div||1}">
      <output></output>`;
    const inp=row.querySelector('input'), out=row.querySelector('output');
    const upd=()=>{ const v=+inp.value; govCfg[d.k]=v;
      out.textContent=(d.div?v/d.div:v)+d.suf;
      const p=(v-d.min)/(d.max-d.min)*100; inp.style.setProperty('--p',p+'%'); };
    inp.oninput=upd; upd(); box.appendChild(row);
  });
}
async function saveGov(){
  const r = await (await fetch('/api/governor',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(govCfg)})).json();
  $('appliedNote').style.display = (r.applied===false && !demoMode)?'block':'none';
  govCur=govCfg.governor; $('govNow').textContent=govCur;
  toast();
}

/* ---------- 启动 ---------- */
refresh(); setInterval(()=>{ if($('pg-home').classList.contains('on')) refresh(); },2000);
</script>
</body>
