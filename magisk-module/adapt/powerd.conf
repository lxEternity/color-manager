INTERVAL=5
# 游戏进程态检测暂失时，保持解锁的宽限时间（秒）；超时才复位频率限制
GAME_EXIT_GRACE_SEC=10
LOG_FILE=/data/adb/modules/colorFC/powerd.log

CPU_PCT_BIG=44      # Prime 大核封顶百分比
CPU_PCT_MID2=50     # Gold+ 次大核封顶百分比
CPU_PCT_MID=48      # Gold 中核封顶百分比
CPU_PCT_LITTLE=59   # Silver 小核封顶百分比

GPU_PCT=35          # GPU 封顶百分比
GPU_BOOST_CONTROL=0 # 0=不写入GPU最低频率/boost节点，1=允许模块控制

# 日常调速器（留空 = 不修改，保持系统默认）
# 常用值: walt / schedutil / powersave / conservative
CPU_GOVERNOR=""

# ── 已知机型频率表 ──────────────────────────────────────────────────────────
# HW_CAPS  = 各 policy 的硬件最高频(kHz)，脚本据此乘以 CPU_PCT_* 算封顶值
# HW_GPU_MAX = GPU 硬件最高频(Hz)，乘以 GPU_PCT 算封顶值
# 留空 = 自动探测。更改 CPU_PCT_* 后无需修改这里，百分比会自动重算。

SOC=$(getprop ro.soc.model 2>/dev/null | tr 'A-Z' 'a-z')

case "$SOC" in

  # 骁龙 8 Elite Gen 5 (SM8850)
  sm8850|sm8850p)
    HW_CAPS="policy0:3628800 policy6:4608000"
    HW_GPU_MAX=1200000000
    ;;

  # 骁龙 8 Elite (SM8750)
  sm8750|sm8750p)
    HW_CAPS="policy0:3532800 policy6:4320000"
    HW_GPU_MAX=1200000000
    ;;

  # 骁龙 8 Gen 5 (SM8845)
  sm8845|sm8845p)
    HW_CAPS="policy0:3321600 policy6:3436800"
    HW_GPU_MAX=900000000
    ;;

  # 骁龙 8 Gen 3 (SM8650)
  sm8650|sm8650p)
    HW_CAPS="policy0:2265600 policy2:3187200 policy5:2956800 policy7:3302400"
    HW_GPU_MAX=900000000
    ;;

  # 骁龙 8 Gen 2 (SM8550)
  sm8550|sm8550p)
    HW_CAPS="policy0:2016000 policy6:2707200"
    HW_GPU_MAX=680000000
    ;;

  # 骁龙 7+ Gen 3 (SM7675)
  sm7675|sm7675p)
    HW_CAPS="policy0:1900800 policy6:2611200"
    HW_GPU_MAX=660000000
    ;;

  # 天玑 9400+ (MT6991)
  mt6991)
    HW_CAPS="policy0:2400000 policy4:3300000 policy7:3730000"
    HW_GPU_MAX=1508000000
    ;;

  # 未匹配 = 自适配
  *)
    HW_CAPS=""
    HW_GPU_MAX=""
    ;;
esac
