<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e1a" />
    <title>自适配动态限频</title>
    <script type="module" crossorigin src="./assets/index-CA8pALd_.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-MQYxA1L9.css">
    <style>
      /* 状态行防换行：徽标/按钮/版本三元素适当缩小、紧凑间距、强制单行 */
      .status-row{flex-wrap:nowrap;white-space:nowrap;gap:8px;font-size:12px}
      .status-row .status-badge{font-size:12px;padding:5px 12px;flex:none}
      .status-row .version{font-size:12px;flex:none}

      /* 切换回 Color 调度按钮：嵌入头部 .status-row（状态徽标与版本号之间），
         样式对齐 .status-badge 胶囊并使用主题 CSS 变量，自动跟随明暗模式 */
      #cfSwapBtn{display:none;align-items:center;gap:6px;margin-left:auto;flex:none;
        padding:5px 12px;border-radius:30px;font-size:12px;font-weight:500;white-space:nowrap;
        background:var(--accent-soft);color:var(--accent);
        border:1px solid var(--accent-border);
        -webkit-tap-highlight-color:transparent;cursor:pointer;user-select:none;
        transition:transform .12s ease,background .2s ease,color .2s ease}
      #cfSwapBtn:active{transform:scale(.96)}
      /* 二次确认态：同步应用的 warn 徽标配色 */
      #cfSwapBtn.confirm{background:var(--amber-soft);color:var(--amber-text);border-color:var(--amber-soft)}
      #cfSwapBtn.busy{opacity:.55;pointer-events:none}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <button id="cfSwapBtn">⇄ Color调度</button>
    <script>
    /* ColorFC 形态切换：点按两次确认 → swap.sh dispatch → 回 Color WebUI */
    (function(){
      var btn = document.getElementById('cfSwapBtn');
      var hasKsu = (typeof ksu !== 'undefined') && (typeof ksu.exec === 'function');
      var seq = 0, armed = false, timer = null, modDir = null;

      function exec(cmd){
        return new Promise(function(res){
          var name = 'cfSwapCb_' + Date.now() + '_' + (seq++);
          window[name] = function(errno, stdout, stderr){
            delete window[name];
            res({errno:errno, stdout:(''+stdout).replace(/^"|"$/g,''), stderr:''+stderr});
          };
          try{ ksu.exec(cmd, '{}', name); }
          catch(e){ delete window[name]; res({errno:-1, stdout:'', stderr:''+e}); }
        });
      }

      function resolveModDir(){
        if(modDir) return Promise.resolve(modDir);
        var cands = ['/data/adb/modules/colorFC','/data/adb/ap/modules/colorFC',
                     '/data/adb/modules/powerd_freqcap','/data/adb/ap/modules/powerd_freqcap'];
        return cands.reduce(function(chain, d){
          return chain.then(function(found){
            if(found) return found;
            return exec('test -x ' + d + '/webroot/api.sh && echo OK').then(function(r){
              return (r.stdout || '').trim() === 'OK' ? (modDir = d) : null;
            });
          });
        }, Promise.resolve(null));
      }

      function reset(){ armed = false; clearTimeout(timer); btn.classList.remove('confirm','busy'); btn.textContent = '⇄ Color调度'; }

      function fail(msg){ btn.classList.remove('busy'); btn.classList.add('confirm'); btn.textContent = '失败:' + msg; setTimeout(reset, 2600); }

      /* 嵌入位置：头部 .status-row 内，状态徽标（工作中·限频中）与版本号之间。
         React 可能整棵重渲染，脱挂后自动回插；margin-left:auto 与版本号保持右侧间距 */
      function mountInHeader(){
        var ver = document.querySelector('.status-row .version');
        if(!ver || !ver.parentNode) return false;
        if(btn.parentNode !== ver.parentNode) ver.parentNode.insertBefore(btn, ver);
        btn.style.display = 'inline-flex';
        return true;
      }
      var mountTries = 0;
      var mountTimer = setInterval(function(){
        if(mountInHeader()){ clearInterval(mountTimer); return; }
        if(++mountTries > 120){ clearInterval(mountTimer); }   // ~36s 后放弃轮询
      }, 300);
      setInterval(function(){ if(!btn.isConnected) mountInHeader(); }, 1000);  // 重渲染脱挂回插

      btn.addEventListener('click', function(){
        if(btn.classList.contains('busy')) return;
        if(!hasKsu){ location.replace('../index.html'); return; }  // 预览环境直接跳转
        if(!armed){
          armed = true; btn.classList.add('confirm'); btn.textContent = '确认切回Color？';
          clearTimeout(timer); timer = setTimeout(reset, 3200);
          return;
        }
        reset();
        btn.classList.add('busy'); btn.textContent = '切换中…';
        resolveModDir().then(function(d){
          if(!d) return fail('未找到模块');
          return exec('sh ' + d + '/webroot/api.sh swap dispatch').then(function(r){
            var out = (r.stdout || '').trim();
            if(/^OK_/.test(out) || out === 'ALREADY_DISPATCH'){ location.replace('../index.html'); }
            else fail('errno=' + r.errno);
          });
        }).catch(function(){ fail('异常'); });
      });
    })();
    </script>
  </body>
</html>
